# ========================================================
# Redis Configuration for E-Commerce (10M+ Products)
# ========================================================
# Production-ready configuration with robust persistence
# optimized for high-volume caching and session storage
# ========================================================

# NETWORK
bind 127.0.0.1
port 6379
timeout 0
tcp-keepalive 300
tcp-backlog 511

# GENERAL
daemonize no
supervised no
pidfile /var/run/redis_6379.pid
loglevel notice
logfile ""
databases 16

# SNAPSHOTTING (RDB) - DISABLED for cache workload
# For cache-heavy workloads with 10M+ products, RDB causes issues:
# - Large memory consumption during fork
# - Disk I/O blocking
# - Unnecessary persistence overhead
save ""
stop-writes-on-bgsave-error no
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir ./

# APPEND ONLY FILE (AOF) - OPTIMIZED
# AOF is better for cache recovery without blocking writes
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite yes
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
aof-load-truncated yes
aof-use-rdb-preamble yes

# MEMORY MANAGEMENT - Critical for 10M+ products
maxmemory 4gb
maxmemory-policy allkeys-lru
maxmemory-samples 5

# LAZY FREEING
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes
replica-lazy-flush yes

# THREADED I/O
io-threads 4
io-threads-do-reads yes

# SLOW LOG
slowlog-log-slower-than 10000
slowlog-max-len 128

# LATENCY MONITOR
latency-monitor-threshold 100

# CLIENTS
maxclients 10000

# REPLICATION (if using master-slave)
# replica-read-only yes
# repl-diskless-sync yes
# repl-diskless-sync-delay 5

# SECURITY
# requirepass your_secure_password_here
# rename-command FLUSHDB ""
# rename-command FLUSHALL ""
# rename-command CONFIG ""

# PERFORMANCE TUNING
hz 10
dynamic-hz yes
activerehashing yes
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit replica 256mb 64mb 60
client-output-buffer-limit pubsub 32mb 8mb 60

# PERSISTENCE WARNINGS DISABLED
# Since we're using Redis primarily as cache,
# persistence failures shouldn't block operations
stop-writes-on-bgsave-error no

# ========================================================
# WINDOWS-SPECIFIC NOTES:
# ========================================================
# If running on Windows (WAMP):
# 1. Install Redis for Windows from:
#    https://github.com/microsoftarchive/redis/releases
# 2. Place this config in Redis installation directory
# 3. Start with: redis-server redis.conf
# 4. Or use WSL2 for native Redis support
# ========================================================
